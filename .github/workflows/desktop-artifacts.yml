name: Desktop artifacts

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
  EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
  EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
  EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
  EXPO_PUBLIC_REVENUECAT_WEB_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_WEB_KEY }}
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  windows:
    name: Microsoft Store package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export web bundle
        run: yarn export:desktop

      - name: Build appx
        shell: bash
        env:
          MS_IDENTITY_NAME: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          MS_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
          MS_PUBLISHER_DISPLAY_NAME: ${{ secrets.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          args=()
          if [ -n "$MS_IDENTITY_NAME" ]; then
            args+=("-c.appx.identityName=$MS_IDENTITY_NAME")
          fi
          if [ -n "$MS_PUBLISHER" ]; then
            args+=("-c.appx.publisher=$MS_PUBLISHER")
          fi
          if [ -n "$MS_PUBLISHER_DISPLAY_NAME" ]; then
            args+=("-c.appx.publisherDisplayName=$MS_PUBLISHER_DISPLAY_NAME")
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "::warning::Microsoft Store identity secrets are unset. Building an appx with placeholder identity — usable for local testing, not for Partner Center submission."
          fi
          npx electron-builder --win appx --publish never "${args[@]+"${args[@]}"}"

      - name: Upload appx
        uses: actions/upload-artifact@v4
        with:
          name: yify-appx
          path: desktop-dist/*.appx
          if-no-files-found: error

  linux:
    name: Snap package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install snap tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          sudo snap install snapcraft --classic

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export web bundle
        run: yarn export:desktop

      - name: Build snap
        run: npx electron-builder --linux snap --publish never

      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: yify-snap
          path: desktop-dist/*.snap
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export web bundle
        run: yarn export:desktop

      - name: Build dmg
        run: npx electron-builder --mac dmg zip --publish never

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: yify-macos
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.zip
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [ windows, linux, macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --clobber
