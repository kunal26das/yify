name: Compile-only Android QA

on:
  pull_request:
    paths:
      - .github/workflows/android-compile-only-qa.yml
      - scripts/android-qa/**
      - tests/android-qa-prerequisites.test.cjs
      - docs/android-qa.md
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character commit containing this QA setup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-compile-only-${{ github.event.pull_request.head.sha || inputs.source_sha }}
  cancel-in-progress: false

jobs:
  compile:
    if: >-
      github.repository == 'kunal26das/yify' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate immutable source selection
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
        run: test "${#SOURCE_SHA}" = 40 && [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false

      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnose official SDK package inventory without installing
        run: |
          mkdir -p "$RUNNER_TEMP/yify-android-qa/evidence"
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties" | tee "$RUNNER_TEMP/yify-android-qa/evidence/sdkmanager-metadata.txt"
          "$SDK_MANAGER" --version | tee "$RUNNER_TEMP/yify-android-qa/evidence/sdkmanager-version.txt"
          "$SDK_MANAGER" --list --channel=0 2>&1 | tee "$RUNNER_TEMP/yify-android-qa/evidence/sdk-inventory-stable.txt"
          "$SDK_MANAGER" --list --channel=3 2>&1 | tee "$RUNNER_TEMP/yify-android-qa/evidence/sdk-inventory-all-channels.txt"
          node scripts/android-qa/preflight.mjs sdk-packages | tee "$RUNNER_TEMP/yify-android-qa/evidence/requested-sdk-packages.txt"
          node - "$RUNNER_TEMP/yify-android-qa/evidence" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const directory = process.argv[2];
          const identifiers = file => fs.readFileSync(path.join(directory, file), 'utf8').split(/\r?\n/)
            .map(line => line.split('|')[0].trim()).filter(line => /^(platforms;|build-tools;|ndk;|cmake;|platform-tools$|cmdline-tools;)/.test(line));
          const stable = identifiers('sdk-inventory-stable.txt');
          const all = identifiers('sdk-inventory-all-channels.txt');
          const requested = fs.readFileSync(path.join(directory, 'requested-sdk-packages.txt'), 'utf8').trim().split(/\r?\n/);
          const report = {kind: 'inventory-only', requested: requested.map(identifier => ({identifier,
            stable: stable.includes(identifier), anyChannel: all.includes(identifier)})),
            platformCandidates: all.filter(identifier => identifier.startsWith('platforms;android-37'))};
          fs.writeFileSync(path.join(directory, 'sdk-inventory-comparison.json'), JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          JS
          echo 'Diagnosis-only run: setup and compilation intentionally remain blocked for independent review.'
          exit 1

      - name: Setup pinned Yarn
        run: npm install --global yarn@1.22.22 --force

      - name: Compile and verify without signing credentials or service uploads
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
        run: bash scripts/android-qa/run-compile-only.sh "$GITHUB_WORKSPACE" "$SOURCE_SHA" "$RUNNER_TEMP/yify-android-qa"

      - name: Preserve setup diagnosis and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-compile-only-${{ github.event.pull_request.head.sha || inputs.source_sha }}
          path: |
            ${{ runner.temp }}/yify-android-qa/bootstrap.json
            ${{ runner.temp }}/yify-android-qa/prerequisites.json
            ${{ runner.temp }}/yify-android-qa/evidence/
          if-no-files-found: warn
          retention-days: 7
