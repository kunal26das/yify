name: Deploy web to EAS Hosting

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: Promote the deployment to the production alias
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify deployment source
    if: >-
      github.repository == 'kunal26das/yify' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ github.event_name == 'workflow_dispatch' || steps.ci.outputs.ready == 'true' }}
      head: ${{ steps.ci.outputs.head || github.sha }}
    steps:
      - name: Checkout trusted deployment verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact successful main CI attempt
        id: ci
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/main-ci.mjs validate

  deploy:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    concurrency:
      group: eas-hosting-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.head }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install locked release tools
        run: yarn install --frozen-lockfile --non-interactive
        working-directory: release
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Prepare Sentry deployment identity
        run: |
          mkdir -p .expo
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          fs.writeFileSync('.expo/sentry-hosting-plan.json', JSON.stringify({
            kind: 'hosting', releases: {web: `${config.expo.name}@${pkg.version}`},
            commit: process.env.GITHUB_SHA, environment: process.env.SENTRY_DEPLOY_ENV,
          }));
          NODE
        env:
          SENTRY_DEPLOY_ENV: ${{ (github.event_name == 'workflow_run' || inputs.production) && 'production' || 'preview' }}

      - name: Export web build for hosting
        run: yarn export:hosting
        env:
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ (github.event_name == 'workflow_run' || inputs.production) && 'production' || 'preview' }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_REVENUECAT_WEB_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_WEB_KEY }}

      - name: Check rendered pages, catalog API and client data boundary
        run: node scripts/check-web-export.mjs dist-hosting --server

      - name: Recheck current main before production promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CHECK_CURRENT_MAIN: ${{ github.event_name == 'workflow_run' || inputs.production }}
        run: node scripts/main-ci.mjs current

      - name: Deploy to EAS Hosting
        run: bash scripts/eas.sh deploy --export-dir dist-hosting --environment production --non-interactive --json ${{ (github.event_name == 'workflow_run' || inputs.production) && '--prod' || '' }}
        env:
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: ${{ (github.event_name == 'workflow_run' || inputs.production) && 'production' || 'preview' }}
          SENTRY_DEPLOYMENT_PLAN: .expo/sentry-hosting-plan.json
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Preserve deployment receipts for metadata-only retries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentry-hosting-deployment
          path: .expo/sentry-hosting-plan.json*
          include-hidden-files: true
          retention-days: 30
