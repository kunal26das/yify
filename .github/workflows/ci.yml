name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: yarn test

      - name: Committed OTA channel is Production
        run: node scripts/check-update-channel.mjs

      - name: Expo doctor
        run: node scripts/check-expo-doctor.mjs

  web-export:
    name: Web exports render and isolate catalog data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export EAS Hosting build
        run: yarn export:hosting

      - name: Check Hosting pages, catalog API and client data boundary
        run: node scripts/check-web-export.mjs dist-hosting --server

      - name: Export GitHub Pages build
        run: yarn export:web

      - name: Check Pages rendering and static client data boundary
        run: node scripts/check-web-export.mjs dist --static

  release-console:
    name: Typecheck and test release console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: release

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: release

      - name: Tests
        run: yarn test
        working-directory: release
