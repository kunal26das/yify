name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clean_install:
        description: Also test a fresh dependency resolution without yarn.lock
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test

      - name: Committed OTA channel is Production
        run: node scripts/check-update-channel.mjs

      - name: Expo doctor
        run: node scripts/check-expo-doctor.mjs

  web-export:
    name: Web exports render and isolate catalog data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export EAS Hosting build
        run: yarn export:hosting

      - name: Check Hosting pages, catalog API and client data boundary
        run: node scripts/check-web-export.mjs dist-hosting --server

      - name: Export GitHub Pages build
        run: yarn export:web

      - name: Check Pages rendering and static client data boundary
        run: node scripts/check-web-export.mjs dist --static

  release-console:
    name: Typecheck and test release console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: release

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: release

      - name: Tests
        run: yarn test
        working-directory: release

  dependabot-clean-install:
    name: Dependabot clean reinstall
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.clean_install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Reinstall dependencies from scratch
        id: reinstall
        run: |
          LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install"
          mkdir -p "$LOCKFILE_REPORT_DIR"
          cp yarn.lock "$LOCKFILE_REPORT_DIR/original-yarn.lock"
          rm -rf -- node_modules crashreporting/node_modules yarn.lock
          yarn install --non-interactive

      - name: Typecheck freshly resolved dependencies
        run: yarn typecheck

      - name: Test freshly resolved dependencies
        run: yarn test

      - name: Check Expo dependency compatibility
        run: node scripts/check-expo-doctor.mjs

      - name: Check fresh Hosting export
        run: |
          yarn export:hosting
          node scripts/check-web-export.mjs dist-hosting --server

      - name: Check fresh Pages export
        run: |
          yarn export:web
          node scripts/check-web-export.mjs dist --static

      - name: Report regenerated lockfile
        if: always()
        env:
          REINSTALL_OUTCOME: ${{ steps.reinstall.outcome }}
        run: |
          LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install"
          mkdir -p "$LOCKFILE_REPORT_DIR"
          printf '## Dependabot clean reinstall\n\nInstall: %s.\n\n' "$REINSTALL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOCKFILE_REPORT_DIR/original-yarn.lock" ] && [ -f yarn.lock ]; then
            cp yarn.lock "$LOCKFILE_REPORT_DIR/regenerated-yarn.lock"
            diff_status=0
            diff -u --label a/yarn.lock --label b/yarn.lock \
              "$LOCKFILE_REPORT_DIR/original-yarn.lock" yarn.lock \
              > "$LOCKFILE_REPORT_DIR/yarn.lock.patch" || diff_status=$?
            if [ "$diff_status" -gt 1 ]; then exit "$diff_status"; fi
            if [ "$diff_status" -eq 0 ]; then
              echo 'The regenerated lockfile matches the committed lockfile.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'The regenerated lockfile differs. The artifact contains both lockfiles and their diff for review.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'No complete lockfile comparison is available because setup or installation failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nThis is an additional compatibility check. Required CI and deployments continue to use the committed lockfile. Regeneration does not write to the PR.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Save lockfile comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-clean-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependabot-clean-install/
          if-no-files-found: warn
          retention-days: 14

  dependabot-auto-merge:
    name: Merge Dependabot patch updates
    needs: [check, web-export, release-console, dependabot-clean-install]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'kunal26das/yify' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.commits == 1 &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No PR checkout or dependency execution in this write-enabled job.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the tested patch update
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3 4; do
            pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
            if ! jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GH_REPO" '
              .head.sha == $sha and .head.repo.full_name == $repo and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .user.login == "dependabot[bot]" and .commits == 1 and (.draft | not)
            ' <<< "$pr" >/dev/null; then
              echo "Pull request no longer matches the tested single-commit Dependabot update."
              exit 1
            fi
            if jq -e '.merged == true' <<< "$pr" >/dev/null; then
              if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$pr" >/dev/null; then
                echo 'merged=true' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if ! jq -e '.state == "open"' <<< "$pr" >/dev/null; then
              echo "Pull request is closed; refusing to merge."
              exit 1
            fi
            if jq -e '.mergeable_state == "behind"' <<< "$pr" >/dev/null; then
              main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
              marker="<!-- dependabot-rebase:$PR_HEAD_SHA:$main_sha -->"
              comments=$(gh api --paginate --slurp "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100")
              if jq -e --arg marker "$marker" '
                any(.[][]; .user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))
              ' <<< "$comments" >/dev/null; then
                echo "Dependabot has already been asked to refresh this head against the current main."
              else
                comment_file=$(mktemp)
                trap 'rm -f "$comment_file"' EXIT
                printf '%s\n\n%s\n' '@dependabot rebase' "$marker" > "$comment_file"
                gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$comment_file"
                echo "Requested a Dependabot refresh; the updated branch must pass CI again."
              fi
              exit 0
            fi
            # Required checks may take a moment to be reflected in branch protection.
            # GitHub still enforces them, and the SHA guard rejects an untested push.
            if gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$PR_HEAD_SHA"; then
              merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
              if jq -e --arg sha "$PR_HEAD_SHA" '.merged == true and .head.sha == $sha' <<< "$merged" >/dev/null; then
                if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$merged" >/dev/null; then
                  echo 'merged=true' >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 10
            fi
          done
          echo "Merge is still blocked; branch protection was not bypassed."
          exit 1

      # GITHUB_TOKEN merges do not trigger the normal push deployment workflows.
      - name: Deploy merged main to EAS Hosting
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-hosting.yml --repo "$GH_REPO" --ref main -f production=true

      - name: Deploy merged main to GitHub Pages
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$GH_REPO" --ref main
