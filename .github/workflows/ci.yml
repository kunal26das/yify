name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test

      - name: Committed OTA channel is Production
        run: node scripts/check-update-channel.mjs

      - name: Expo doctor
        run: node scripts/check-expo-doctor.mjs

  web-export:
    name: Web exports render and isolate catalog data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export EAS Hosting build
        run: yarn export:hosting

      - name: Check Hosting pages, catalog API and client data boundary
        run: node scripts/check-web-export.mjs dist-hosting --server

      - name: Export GitHub Pages build
        run: yarn export:web

      - name: Check Pages rendering and static client data boundary
        run: node scripts/check-web-export.mjs dist --static

  release-console:
    name: Typecheck and test release console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: release

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: release

      - name: Tests
        run: yarn test
        working-directory: release

  dependabot-auto-merge:
    name: Merge Dependabot patch updates
    needs: [check, web-export, release-console]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'kunal26das/yify' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.commits == 1 &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No PR checkout or dependency execution in this write-enabled job.
      - name: Verify Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the tested patch update
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in 1 2 3 4; do
            pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
            if ! jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GH_REPO" '
              .head.sha == $sha and .head.repo.full_name == $repo and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .user.login == "dependabot[bot]" and .commits == 1 and (.draft | not)
            ' <<< "$pr" >/dev/null; then
              echo "Pull request no longer matches the tested single-commit Dependabot update."
              exit 1
            fi
            if jq -e '.merged == true' <<< "$pr" >/dev/null; then
              if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$pr" >/dev/null; then
                echo 'merged=true' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if ! jq -e '.state == "open"' <<< "$pr" >/dev/null; then
              echo "Pull request is closed; refusing to merge."
              exit 1
            fi
            if jq -e '.mergeable_state == "behind"' <<< "$pr" >/dev/null; then
              main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
              marker="<!-- dependabot-rebase:$PR_HEAD_SHA:$main_sha -->"
              comments=$(gh api --paginate --slurp "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100")
              if jq -e --arg marker "$marker" '
                any(.[][]; .user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))
              ' <<< "$comments" >/dev/null; then
                echo "Dependabot has already been asked to refresh this head against the current main."
              else
                comment_file=$(mktemp)
                trap 'rm -f "$comment_file"' EXIT
                printf '%s\n\n%s\n' '@dependabot rebase' "$marker" > "$comment_file"
                gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$comment_file"
                echo "Requested a Dependabot refresh; the updated branch must pass CI again."
              fi
              exit 0
            fi
            # Required checks may take a moment to be reflected in branch protection.
            # GitHub still enforces them, and the SHA guard rejects an untested push.
            if gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$PR_HEAD_SHA"; then
              merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
              if jq -e --arg sha "$PR_HEAD_SHA" '.merged == true and .head.sha == $sha' <<< "$merged" >/dev/null; then
                if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$merged" >/dev/null; then
                  echo 'merged=true' >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 10
            fi
          done
          echo "Merge is still blocked; branch protection was not bypassed."
          exit 1

      # GITHUB_TOKEN merges do not trigger the normal push deployment workflows.
      - name: Deploy merged main to EAS Hosting
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-hosting.yml --repo "$GH_REPO" --ref main -f production=true

      - name: Deploy merged main to GitHub Pages
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$GH_REPO" --ref main
