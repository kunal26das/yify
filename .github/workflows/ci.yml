name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clean_install:
        description: Also test a fresh dependency resolution without yarn.lock
        type: boolean
        default: false
      dependabot_pr:
        description: Dependabot PR to validate after the lockfile commit
        type: string
        default: ''
      dependabot_head:
        description: Exact Dependabot PR head to validate
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-context:
    name: Verify dependency automation context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      eligible: ${{ steps.inspect.outputs.eligible == 'true' }}
      pr: ${{ steps.inspect.outputs.pr }}
      head: ${{ steps.inspect.outputs.head }}
      source: ${{ steps.inspect.outputs.source }}
      branch: ${{ steps.inspect.outputs.branch }}
      refreshed: ${{ steps.inspect.outputs.refreshed }}
    steps:
      - name: Checkout trusted automation
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          inputs.dependabot_pr != '' || inputs.dependabot_head != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify PR identity and commit chain
        id: inspect
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          inputs.dependabot_pr != '' || inputs.dependabot_head != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.dependabot_pr }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.dependabot_head }}
        run: node scripts/dependabot-lockfile.mjs inspect

  check:
    needs: dependabot-context
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dependabot_head || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check exact dependency pins
        run: node scripts/check-dependency-pins.mjs

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test

      - name: Committed OTA channel is Production
        run: node scripts/check-update-channel.mjs

      - name: Expo doctor
        run: node scripts/check-expo-doctor.mjs

  web-export:
    needs: dependabot-context
    name: Web exports render and isolate catalog data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dependabot_head || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export EAS Hosting build
        run: yarn export:hosting

      - name: Check Hosting pages, catalog API and client data boundary
        run: node scripts/check-web-export.mjs dist-hosting --server

      - name: Export GitHub Pages build
        run: yarn export:web

      - name: Check Pages rendering and static client data boundary
        run: node scripts/check-web-export.mjs dist --static

  release-console:
    needs: dependabot-context
    name: Typecheck and test release console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dependabot_head || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: release

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: release

      - name: Tests
        run: yarn test
        working-directory: release

  dependabot-clean-install:
    name: Dependabot clean reinstall
    needs: dependabot-context
    outputs:
      artifact_name: ${{ steps.report.outputs.artifact_name }}
      source_run_attempt: ${{ steps.report.outputs.source_run_attempt }}
    if: >-
      (needs.dependabot-context.outputs.eligible == 'true' &&
       needs.dependabot-context.outputs.refreshed == 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.clean_install && inputs.dependabot_pr == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.dependabot-context.outputs.source || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Reinstall dependencies from scratch
        id: reinstall
        run: |
          LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install"
          mkdir -p "$LOCKFILE_REPORT_DIR"
          cp yarn.lock "$LOCKFILE_REPORT_DIR/original-yarn.lock"
          rm -rf -- node_modules crashreporting/node_modules yarn.lock
          yarn install --non-interactive

      - name: Typecheck freshly resolved dependencies
        run: yarn typecheck

      - name: Test freshly resolved dependencies
        run: yarn test

      - name: Check Expo dependency compatibility
        run: node scripts/check-expo-doctor.mjs

      - name: Check fresh Hosting export
        run: |
          yarn export:hosting
          node scripts/check-web-export.mjs dist-hosting --server

      - name: Check fresh Pages export
        run: |
          yarn export:web
          node scripts/check-web-export.mjs dist --static

      - name: Report regenerated lockfile
        id: report
        if: always()
        env:
          REINSTALL_OUTCOME: ${{ steps.reinstall.outcome }}
        run: |
          LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install"
          mkdir -p "$LOCKFILE_REPORT_DIR"
          echo "artifact_name=dependabot-clean-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf '## Dependabot clean reinstall\n\nInstall: %s.\n\n' "$REINSTALL_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$LOCKFILE_REPORT_DIR/original-yarn.lock" ] && [ -f yarn.lock ]; then
            cp yarn.lock "$LOCKFILE_REPORT_DIR/regenerated-yarn.lock"
            diff_status=0
            diff -u --label a/yarn.lock --label b/yarn.lock \
              "$LOCKFILE_REPORT_DIR/original-yarn.lock" yarn.lock \
              > "$LOCKFILE_REPORT_DIR/yarn.lock.patch" || diff_status=$?
            if [ "$diff_status" -gt 1 ]; then exit "$diff_status"; fi
            if [ "$diff_status" -eq 0 ]; then
              echo 'The regenerated lockfile matches the committed lockfile.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'The regenerated lockfile differs. The artifact contains both lockfiles and their diff for review.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'No complete lockfile comparison is available because setup or installation failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nSuccessful Dependabot regeneration is committed back to the PR by a separate job. Full CI then validates the new commit using the committed lockfile.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Bind regenerated lockfile to its source
        if: success() && needs.dependabot-context.outputs.eligible == 'true'
        env:
          PR_NUMBER: ${{ needs.dependabot-context.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.dependabot-context.outputs.source }}
        run: LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install" node scripts/dependabot-lockfile.mjs capture

      - name: Save lockfile comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.report.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependabot-clean-install/
          if-no-files-found: warn
          retention-days: 14

  dependabot-write-lock:
    name: Commit regenerated Dependabot lockfile
    needs: [dependabot-context, dependabot-clean-install]
    if: >-
      needs.dependabot-context.outputs.eligible == 'true' &&
      needs.dependabot-context.outputs.refreshed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      new_sha: ${{ steps.publish.outputs.new_sha }}
    steps:
      # Only trusted main code and lockfile data enter this write-enabled job.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Download this run's lockfile report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.dependabot-clean-install.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependabot-clean-install
      - name: Commit lockfile and request CI on the new head
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dependabot-context.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.dependabot-context.outputs.source }}
          SOURCE_RUN_ATTEMPT: ${{ needs.dependabot-clean-install.outputs.source_run_attempt }}
        run: LOCKFILE_REPORT_DIR="$RUNNER_TEMP/dependabot-clean-install" node scripts/dependabot-lockfile.mjs publish

  dependabot-auto-merge:
    name: Merge Dependabot patch updates
    needs: [dependabot-context, check, web-export, release-console, dependabot-clean-install, dependabot-write-lock]
    if: >-
      always() && !cancelled() && github.repository == 'kunal26das/yify' &&
      needs.dependabot-context.result == 'success' &&
      needs.dependabot-context.outputs.eligible == 'true' &&
      needs.check.result == 'success' && needs.web-export.result == 'success' &&
      needs.release-console.result == 'success' &&
      (needs.dependabot-context.outputs.refreshed == 'true' ||
       (needs.dependabot-clean-install.result == 'success' &&
        needs.dependabot-write-lock.result == 'success' &&
        needs.dependabot-write-lock.outputs.changed == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No PR code or dependency execution in this write-enabled job.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node for the metadata verifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reverify the tested PR head
        id: inspect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.dependabot-context.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.dependabot-context.outputs.head }}
          ALLOW_MERGED: 'true'
        run: node scripts/dependabot-lockfile.mjs inspect
      - name: Checkout pinned Dependabot metadata verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98
          path: .github-tools/fetch-metadata
          persist-credentials: false

      - name: Verify Dependabot metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_EVENT_FILE: ${{ steps.inspect.outputs.event_file }}
        # Set the event inside the process: the runner replaces GITHUB_EVENT_PATH for uses actions.
        run: |
          node <<'NODE'
          process.env.GITHUB_EVENT_PATH = process.env.VERIFIED_EVENT_FILE;
          process.env['INPUT_GITHUB-TOKEN'] = process.env.GH_TOKEN;
          process.env['INPUT_SKIP-COMMIT-VERIFICATION'] = 'false';
          process.env['INPUT_SKIP-VERIFICATION'] = 'false';
          require('./.github-tools/fetch-metadata/dist/index.js');
          NODE

      - name: Merge the tested patch update
        id: merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.dependabot-context.outputs.pr }}
          PR_HEAD_SHA: ${{ needs.dependabot-context.outputs.head }}
        run: |
          for attempt in 1 2 3 4; do
            pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
            if ! jq -e --arg sha "$PR_HEAD_SHA" --arg repo "$GH_REPO" '
              .head.sha == $sha and .head.repo.full_name == $repo and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .user.login == "dependabot[bot]" and (.draft | not)
            ' <<< "$pr" >/dev/null; then
              echo "Pull request no longer matches the tested Dependabot update."
              exit 1
            fi
            if jq -e '.merged == true' <<< "$pr" >/dev/null; then
              if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$pr" >/dev/null; then
                echo 'merged=true' >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            if ! jq -e '.state == "open"' <<< "$pr" >/dev/null; then
              echo "Pull request is closed; refusing to merge."
              exit 1
            fi
            node scripts/dependabot-lockfile.mjs inspect
            if jq -e '.mergeable_state == "behind"' <<< "$pr" >/dev/null; then
              main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
              marker="<!-- dependabot-rebase:$PR_HEAD_SHA:$main_sha -->"
              comments=$(gh api --paginate --slurp "repos/$GH_REPO/issues/$PR_NUMBER/comments?per_page=100")
              if jq -e --arg marker "$marker" '
                any(.[][]; .user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))
              ' <<< "$comments" >/dev/null; then
                echo "Dependabot has already been asked to refresh this head against the current main."
              else
                comment_file=$(mktemp)
                trap 'rm -f "$comment_file"' EXIT
                printf '%s\n\n%s\n' '@dependabot rebase' "$marker" > "$comment_file"
                gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body-file "$comment_file"
                echo "Requested a Dependabot refresh; the updated branch must pass CI again."
              fi
              exit 0
            fi
            # Required checks may take a moment to be reflected in branch protection.
            # GitHub still enforces them, and the SHA guard rejects an untested push.
            if gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$PR_HEAD_SHA"; then
              merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
              if jq -e --arg sha "$PR_HEAD_SHA" '.merged == true and .head.sha == $sha' <<< "$merged" >/dev/null; then
                if jq -e '.merged_by.login == "github-actions[bot]"' <<< "$merged" >/dev/null; then
                  echo 'merged=true' >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 10
            fi
          done
          echo "Merge is still blocked; branch protection was not bypassed."
          exit 1

      # GITHUB_TOKEN merges do not trigger the normal push deployment workflows.
      - name: Deploy merged main to EAS Hosting
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-hosting.yml --repo "$GH_REPO" --ref main -f production=true

      - name: Deploy merged main to GitHub Pages
        if: ${{ !cancelled() && steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-pages.yml --repo "$GH_REPO" --ref main
