version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 30
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "@expo/log-box"
          - "@expo/metro-runtime"
          - "@expo/ui"
          - "@expo/vector-icons"
          - "eslint-config-expo"
          - "expo-background-task"
          - "expo-blur"
          - "expo-build-properties"
          - "expo-constants"
          - "expo-dev-client"
          - "expo-font"
          - "expo-glass-effect"
          - "expo-haptics"
          - "expo-image"
          - "expo-insights"
          - "expo-keep-awake"
          - "expo-linking"
          - "expo-localization"
          - "expo-location"
          - "expo-navigation-bar"
          - "expo-network"
          - "expo-notifications"
          - "expo-router"
          - "expo-splash-screen"
          - "expo-sqlite"
          - "expo-status-bar"
          - "expo-store-review"
          - "expo-symbols"
          - "expo-system-ui"
          - "expo-task-manager"
          - "expo-updates"
          - "expo-web-browser"
          - "react-native"
          - "@react-native/*"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-dom"
          - "react-native-reanimated"
          - "react-native-worklets"
          - "react-native-gesture-handler"
          - "react-native-safe-area-context"
          - "react-native-screens"
          - "react-native-web"
          - "react-native-webview"
      firebase-native:
        patterns: ["@react-native-firebase/*", "firebase"]
      native-sdks:
        patterns:
          - "@sentry/*"
          - "react-native-purchases"
          - "@revenuecat/*"
          - "react-native-google-mobile-ads"
          - "@react-native-google-signin/*"
          - "@gorhom/*"
          - "react-native-youtube-iframe"
          - "react-native-web-webview"
          - "expo-in-app-updates"
          - "expo-device-corner-radius"
      tooling:
        patterns: ["typescript", "eslint*", "@eslint/*", "@typescript-eslint/*", "@babel/*"]
      everything-else:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      actions-updates:
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
