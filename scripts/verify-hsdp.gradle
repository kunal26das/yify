def expectedRootPath = System.getProperty('hsdp.verify.androidRoot')
if (expectedRootPath == null) throw new GradleException('Expected -Dhsdp.verify.androidRoot for HSDP verification')
def expectedRoot = new File(expectedRootPath).canonicalFile

gradle.projectsEvaluated {
    if (gradle.rootProject.projectDir.canonicalFile != expectedRoot) return
    if (gradle.rootProject.name != 'Yify') throw new GradleException('Expected Yify Android root project')
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Expected :app in Yify Android root project')
    app.tasks.register('verifyHsdpRuntime') {
        doLast {
            def minSdk = app.extensions.getByName('android').defaultConfig.minSdk
            if (minSdk == null || minSdk < 24) {
                throw new GradleException("Android minSdk must be at least 24 for HSDP 2.2.0; got ${minSdk}")
            }

            def constraints = app.configurations.getByName('implementation').dependencyConstraints.findAll {
                it.group == 'com.google.android.play' && it.name == 'hsdp'
            }
            if (constraints.size() != 1 || constraints.first().versionConstraint.strictVersion != '2.2.0') {
                throw new GradleException('Expected exactly one strict HSDP 2.2.0 implementation constraint')
            }

            def result = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult
            def unresolved = result.allDependencies.findAll {
                it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
            }
            if (!unresolved.isEmpty()) {
                throw new GradleException("Release runtime graph has ${unresolved.size()} unresolved dependencies")
            }
            def selected = result.allComponents.findAll {
                def id = it.id
                id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                    id.group == 'com.google.android.play' && id.module == 'hsdp'
            }
            if (selected.size() != 1 || selected.first().id.version != '2.2.0') {
                throw new GradleException("Expected resolved HSDP 2.2.0; found ${selected.collect { it.id.displayName }}")
            }

            println("Verified Android minSdk ${minSdk}, strict HSDP 2.2.0 constraint, and resolved HSDP ${selected.first().id.version}")
        }
    }
}
