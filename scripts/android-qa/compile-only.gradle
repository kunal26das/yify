if (System.getenv('SENTRY_DISABLE_AUTO_UPLOAD') != 'true') {
    throw new GradleException('Compile-only QA requires SENTRY_DISABLE_AUTO_UPLOAD=true')
}

def verifyToolchainVersions = { expected, kotlinVersion, r8Version ->
    if (kotlinVersion != expected.kotlin) {
        throw new GradleException("Compile-only QA refuses an effective Kotlin version outside the audited toolchain: ${kotlinVersion}")
    }
    def r8Match = r8Version instanceof String
        ? r8Version =~ /^(\d+\.\d+\.\d+)(?: \(build [A-Za-z0-9][A-Za-z0-9(). \/_-]*\))?$/
        : null
    if (r8Match == null || !r8Match.matches() || r8Match.group(1) != expected.r8) {
        throw new GradleException("Compile-only QA refuses an unaudited R8 version: ${r8Version}")
    }
}
gradle.ext.yifyVerifyToolchainVersions = verifyToolchainVersions

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app != null && app.plugins.hasPlugin('com.android.application')) {
        def android = app.extensions.getByName('android')
        if (android.ndkVersion != '27.1.12297006') throw new GradleException('Compile-only QA refuses an NDK override')
        if (android.buildToolsVersion != '37.0.0') throw new GradleException('Compile-only QA refuses a build-tools override')
        if (android.defaultConfig.minSdk != 24 || android.defaultConfig.targetSdk != 36 || android.compileSdk != 37) {
            throw new GradleException('Compile-only QA refuses Android API level overrides')
        }
        def toolchain = new groovy.json.JsonSlurper().parse(gradle.rootProject.file('../scripts/android-qa/toolchain.json'))
        def kotlinPlugin = app.plugins.findPlugin('org.jetbrains.kotlin.android')
        if (kotlinPlugin == null) throw new GradleException('Compile-only QA requires the Android Kotlin plugin')
        def kotlinVersionClass = kotlinPlugin.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt')
        def kotlinVersion = kotlinVersionClass.getMethod('getKotlinPluginVersion', org.gradle.api.Project).invoke(null, app)
        if (gradle.rootProject.ext.kotlinVersion != toolchain.kotlin) {
            throw new GradleException('Compile-only QA refuses an unaudited shared Kotlin version')
        }
        def androidPlugin = app.plugins.findPlugin('com.android.application')
        def r8VersionClass = androidPlugin.class.classLoader.loadClass('com.android.tools.r8.Version')
        def r8Version = r8VersionClass.getMethod('getVersionString').invoke(null)
        verifyToolchainVersions(toolchain, kotlinVersion, r8Version)
        println("Verified effective Android toolchain: Kotlin ${kotlinVersion}, R8 ${r8Version}")
        android.buildTypes.release.firebaseCrashlytics.nativeSymbolUploadEnabled = false
        def expectedCompilers = toolchain.kotlinCompilerPlugins
        if (!(expectedCompilers instanceof List) || expectedCompilers.size() != 2 ||
            expectedCompilers.collect { it.module }.toSet() !=
                ['io.github.expo.pika:pika-compiler', 'io.github.expo:expo-modules-v2-compiler-plugin'].toSet()) {
            throw new GradleException('Compile-only QA requires both reviewed Kotlin compiler artifact pins')
        }
        def compilerReports = []
        gradle.rootProject.allprojects.each { project ->
            def configurations = project.configurations.findAll { configuration ->
                def name = configuration.name.toLowerCase(java.util.Locale.ROOT)
                configuration.canBeResolved && name.startsWith('kotlincompilerpluginclasspath') && name.contains('release')
            }
            if (!configurations.isEmpty()) {
                def reportFile = project.layout.buildDirectory.file('reports/yify/kotlin-compiler-artifacts.json').get().asFile
                def verifier = project.tasks.register('verifyReleaseKotlinCompilerArtifacts') {
                    doLast {
                        def artifacts = [:]
                        configurations.each { configuration ->
                        configuration.incoming.artifacts.artifacts.each { artifact ->
                            def component = artifact.id.componentIdentifier
                            if (component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                                def expected = expectedCompilers.find { it.module == "${component.group}:${component.module}".toString() }
                                if (expected != null && component.version != "${expected.version}-${toolchain.kotlin}".toString()) {
                                    throw new GradleException("Unaudited Kotlin compiler variant: ${component.group}:${component.module}:${component.version}")
                                }
                                artifacts["${component.group}:${component.module}:${component.version}".toString()] = artifact.file
                            }
                        }
                        }
                        def verified = [:]
                        expectedCompilers.each { expected ->
                            def coordinate = "${expected.module}:${expected.version}-${toolchain.kotlin}".toString()
                            def file = artifacts[coordinate]
                            if (file != null) {
                                if (!file.isFile()) throw new GradleException("Missing reviewed Kotlin compiler artifact: ${coordinate}")
                                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
                                if (digest != expected.sha256) throw new GradleException("Unrecognized Kotlin compiler artifact: ${coordinate}")
                                verified[coordinate] = digest
                            }
                        }
                        reportFile.parentFile.mkdirs()
                        reportFile.text = groovy.json.JsonOutput.toJson([project: project.path, configurations: configurations.size(), artifacts: verified])
                    }
                }
                compilerReports << [task: verifier, file: reportFile]
            }
        }
        gradle.rootProject.tasks.register('verifyKotlinCompilerArtifacts') {
            dependsOn(compilerReports.collect { it.task })
            doLast {
                if (compilerReports.isEmpty()) throw new GradleException('Compile-only QA found no release Kotlin compiler configurations')
                def reports = compilerReports.collect { new groovy.json.JsonSlurper().parse(it.file) }
                def verified = reports.collectMany { it.artifacts.keySet() }.toSet()
                expectedCompilers.each { expected ->
                    def coordinate = "${expected.module}:${expected.version}-${toolchain.kotlin}".toString()
                    if (!verified.contains(coordinate)) throw new GradleException("Missing reviewed Kotlin compiler artifact: ${coordinate}")
                    println("Verified Kotlin compiler artifact: ${coordinate} SHA-256 ${expected.sha256}")
                }
                println("Verified ${reports.sum { it.configurations }} release Kotlin compiler configurations before app compilation")
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.each { task ->
        def name = task.name.toLowerCase(java.util.Locale.ROOT)
        if (name.contains('upload') && (name.contains('crashlytics') || name.contains('sentry'))) {
            task.enabled = false
            task.onlyIf('Compile-only QA blocks telemetry uploads') { false }
        } else if (name.contains('upload') || name.startsWith('publish') || name.startsWith('deploy') || name.startsWith('submit')) {
            task.onlyIf('Compile-only QA rejects external mutation at execution') {
                throw new GradleException("Compile-only QA refuses externally mutating task execution: ${task.path}")
            }
        }
    }
    def forbidden = graph.allTasks.findAll { task ->
        def name = task.name.toLowerCase(java.util.Locale.ROOT)
        task.enabled && (name.contains('upload') || name.startsWith('publish') || name.startsWith('deploy') || name.startsWith('submit'))
    }
    if (!forbidden.isEmpty()) throw new GradleException("Compile-only QA refuses externally mutating tasks: ${forbidden*.path}")
    println('Verified compile-only task graph: telemetry uploads disabled and execution-gated; unknown mutation guards installed at graph readiness and execution')
}
